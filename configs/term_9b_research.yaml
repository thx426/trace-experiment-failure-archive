# Qwen3.5-9B 终端域基线能力探针(CD-011)。
# 架构:A800 起 sglang 服务 + 162 环境池(docker socket 经 ssh 转发)。
# 只做 bare 臂 greedy —— 量训练前的起点能力,不引入任何特权信号。
run:
  name: term_9b_probe
  runs_root: /fs/fast/u2021000902/wushang/workspace/TRACE-OPD-TERM/runs
  tape: false

research:
  enabled: true
  backend: external
  tool_protocol: fncall     # 9B 原生 FC(与 executor 同模板家族,无 dialect 错配)
  n_exp: 6                  # 每会话实验预算(探针取中等,控 episode 开销)
  k_default: 2
  k_max: 4
  max_turns: 24
  wrapup_buffer: 2
  doc_max_words: 800        # 终端任务文档:比 ALFWorld 长(说明书本身就长)
  gt: "off"                 # 无特权 GT,只靠自跑实验观察
  researcher_max_tokens: 4096
  session_timeout_s: 2400.0
  session_token_budget: 60000
  max_prompt_tokens: 24000  # 终端说明书 3-6k 字符,scaffold 比 ALFWorld 大

environment:
  name: terminal            # 环境注册表选路(默认 alfworld)

steering:
  enabled: false          # bare 臂:零特权信号,与 GRPO 底座逐字节一致
  doc_source: static

episode:
  max_env_steps: 30          # TMax 官方 agent.timeout 语境下的步预算(与训练同)
  max_assistant_turns: 40
  session_token_budget: 0
  max_tokens_per_turn: 2048

train:
  model_path: /fs/fast/u2021000902/wushang/model/Qwen/Qwen3.5-9B
  response_length: 16384

terminal:
  protocol: fncall
  backend: docker            # 162 环境池
  docker_host: unix:///tmp/docker162.sock
  snapshot_root: /data4/wushang/tmax-snap        # 宿主侧路径(bind-mount 由宿主解析)
  snapshot_index: ${TERMINAL_SNAPSHOT_INDEX}     # 客户端可见的清单
  task_data_root: ${TERMINAL_TASK_DATA}
  image: ${TERMINAL_IMAGE}
  pod_cpu: "1"
  pod_memory: "2g"          # docker 单位(K8s 的 2Gi 写法 docker 不认)
  spawn_concurrency: 8
  create_timeout_s: 300.0
  setup_timeout_s: 600.0
  test_timeout_s: 600.0      # TMax _MIN_TEST_TIMEOUT_S 下限
  test_grace_s: 120.0        # 外层墙钟须显著大于沙箱内判分 timeout
  command_timeout_s: 120.0

# ---- researcher 探针(9B 自任 researcher:executor 与 researcher 同一服务)----
# 用户裁定 2026-08-11:researcher 也用 9B 本身,量"自体研究员"在终端域的
# 文档产出质量。信息状态:gt=off —— researcher 无特权 GT,只能靠自己跑
# 实验 episode 观察,与信息状态一致性红线合规。
roles:
  researcher:
    endpoint: http://127.0.0.1:8299/v1
    model: qwen35-9b
    mode: external_pool
    sidecar_sleep: false
    dp_size: 0
    api_key_env: DUMMY_KEY
    max_concurrency: 8
    temperature: 0.7
    max_tokens: 8192
    timeout_s: 900.0

narration:
  backend: engine
