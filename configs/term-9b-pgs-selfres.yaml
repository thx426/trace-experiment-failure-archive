# =============================================================================
# 终端域 × Qwen3.5-9B × PGS v4 自体研究员 —— 正式训练(A800 训练 + 162 环境池)
#
# 用户裁定(2026-08-12):
#   ① researcher = v4 selfres 引擎内自体(research_rl.enabled=true ⇒ 配置校验
#      强制 research.backend=engine + tool_protocol=text,与 external+fncall 的
#      探针路径不同);
#   ② 不设纯 GRPO 对照臂(对照另在 162 四卡起独立 run);
#   ③ 规模 = 训练集两个 epoch;
#   ④ 训练集不再单独划 val,val 直接用 Terminal-Bench 各版本测试集,分开上报。
#   ⑤ batch32 × n16;max_prompt_length 8K;response_length 64K。
#
# 数据事实(2026-08-11/12 实测,非估计):
#   * 快照覆盖 14,005/14,602(95.9%);preflight 32/32 全绿,reward 阴性对照
#     零假阳性;失败 597 个已定性(约 345 境外网络、201 任务自身、1 数据缺失)。
#   * 9B bare 基线在 TMax valid 上 20/65=30.8%(**与 TB2.0 的 21.1% 锚不可比**,
#     不同数据集口径)。
#   * 单 episode ≈ 12k token(25.1 步 × ~480 tok);8 卡 dp4×tp2 实测 14,247 tok/s
#     ⇒ batch32×n16=512 episode/step,纯 rollout 约 7.2 分钟。
#   * 两个 epoch = 14,005 ÷ 32 × 2 ≈ **876 步**。按 15 min/step 计约 9 天;
#     首个 step 的真实墙钟出来后按实测修正本注释。
# =============================================================================

run:
  name: term_9b_pgs_selfres
  runs_root: /fs/fast/u2021000902/wushang/workspace/TRACE-OPD-TERM/runs
  tape: true                 # 全量交互磁带:selfres 首次上终端域,轨迹必须可回溯

environment:
  name: terminal             # 环境注册表选路(默认 alfworld,不设会静默跑错域)

# --- v4 自体研究员 ---------------------------------------------------------
# backend=engine + tool_protocol=text 是 research_rl 的**强制约束**(config
# _validate);external+fncall 那条路径是探针用的,两者不可混。
research:
  enabled: true
  backend: engine
  tool_protocol: text
  n_exp: 6                   # 探针实测:平均用到 3.7 次即 finalize,6 是宽松上限
  k_default: 2
  k_max: 4
  max_turns: 24              # 探针实测轮次中位 7.1,24 留足余量
  wrapup_buffer: 2
  fetch_raw_limit: 20
  fetch_raw_max_chars: 16000
  doc_max_words: 800         # 终端说明书本就长,文档不宜再膨胀(探针中位 491 词)
  gt: "off"                  # 信息状态红线:researcher 无特权 GT
  episode_temperature: 1.0
  researcher_max_tokens: 4096
  session_timeout_s: 2400
  session_token_budget: 60000
  # 只限 researcher **首调** prompt(system + tools 块 + kickoff),不是全会话。
  # 终端域实测该 scaffold ≈ 10.1k 字符 ≈ 3k token(ALFWorld 仅 1.4k)。两条硬约束:
  #   ① ≤ train.max_prompt_length(8192) —— research 行与 executor 行共用 padding 维度
  #   ② + session_token_budget ≤ rollout_max_model_len(73728)
  max_prompt_tokens: 8000

research_rl:
  enabled: true              # ← selfres 开关本身
  research_n: 8              # research GRPO 组大小
  continuation_samples: 4
  continuation_temperature: 1.0
  researcher_temperature: 1.0
  research_rl_weight: 1.0    # λ_r —— 对齐 SSB-4B-selfres-engine(默认 0.1 是旧保守档)
  research_warmup_steps: 0

narration:
  backend: engine
  max_words: 1000
  temperature: 0.3
  # 叙述输入 = 整条 episode 的动作+观测流。终端观测按 TMax 口径截到 10k 字符/步、
  # 最多 30 步 ⇒ 远大于 ALFWorld;SSB-engine run 用 32768,沿用(设小会 fail-loud)。
  max_prompt_tokens: 32768

# --- 采样端特权(v3.3 asym,沿用 9B 冒烟档)---------------------------------
steering:
  enabled: true
  # SPS 执行层 —— 对齐 SSB-4B-selfres-engine run(2026-08-10):
  #   executor=engine:SPS 循环搬进 server actor 进程,每 turn 1 次 RPC
  #     (python 档是训练进程内循环、每周期 2 次 RPC)。纯执行层,采样分布
  #     逐位恒等,不进指纹。
  #   draft_horizon=64:bounded K。拒绝时丢弃的 suffix 上界 = K−1,是 SSB
  #     "近平方放大"的解;仅 engine 档允许非零(HTTP 路径上小 K 会让每周期
  #     固定往返成本 × 周期数暴涨,CD-006 已证)。
  executor: engine
  draft_horizon: 64
  doc_source: researcher
  doc_table: ""
  eta_max: 0.5
  c: 2.5
  b_max: .inf
  topk: 64
  obs_topk: 256
  theta_d: 0.0
  gate_mode: entropy
  gate_adaptive: true
  gate_target_rate: 0.10
  gate_ema_beta: 0.1
  epsilon: 0.05
  gate_rate_bounds: [0.05, 0.25]
  r_max: 0
  w_beh_mode: "off"
  w_beh_shaped_gamma: 0.1
  adv_mode: asym
  steered_adv_weight: 1.0
  steered_adv_decay_steps: 400     # ≈ 876 步的前半程退火(冒烟档的 240 按 300 步定)
  steered_adv_decay_mode: cosine_steps
  steered_adv_cap: 0.0
  entropy_target_rate: 0.05
  # 熵门剂量:**分位自标定**,不设绝对 nats 阈值。
  #   entropy_theta_init: 0 ⇒ warmup 哨兵(θ=1e9)⇒ w=H/θ≈1e-9 < w_min ⇒
  #     首步全 bypass、零 rng draw、零干预,steered 臂与 bare 逐位一致;
  #     首个 step 的边界直接从真实熵分布分位落地(MENTOR 首步 γ_p=999 同款)。
  #   entropy_theta_update: direct ⇒ 每步分位直标,无 EMA 时延
  #     (β=0.1 曾让错误起点 24 步收敛不到位、门率全程 3× 超标)。
  #   entropy_theta_ratchet: true ⇒ θ 不低于首次标定值:策略熵坍缩时 w 全体
  #     下降、教师自动淡出,而不是阈值跟着坍缩把门变宽(取代绝对 floor)。
  # ⚠ 绝不可回填 1.28/0.6 这类绝对值 —— 跨 benchmark/模型不可迁移,
  #   即 2026-08-11 诊断的"1.28 占位值事故"。
  entropy_theta_init: 0.0
  entropy_theta_update: direct
  entropy_theta_ratchet: true
  intensity_w_min: 0.05
  steered_fraction: 0.5
  budget_pacing: false
  budget_u0: 5.0
  budget_profile_power: 2.0

episode:
  # 用户指令 2026-08-12:executor 交互轮数上限提到 50(原 30)。
  # 依据:66 任务基线实测里 **74% 的失败是打满 30 步未提交**(34/46),而成功者
  # 步数 p90 已到 27、max 30 —— 30 不是宽松预算而是紧贴成功轨迹长度的硬墙,
  # 会把"预算不足"伪装成"能力不足"(effect-limiters 教训)。
  max_env_steps: 50
  # 轮上限 = 步预算 + 格式失败余量(加载强校验要求 turns > steps)
  max_assistant_turns: 60
  session_token_budget: 0    # 0 = 跟随 train.response_length
  max_tokens_per_turn: 2048

# --- 环境池(162,跨机 docker socket)---------------------------------------
terminal:
  protocol: fncall
  backend: docker
  docker_host: unix:///tmp/docker162.sock   # 先跑 ~/dockfwd.sh;ControlMaster 必须关
  snapshot_root: /data4/wushang/tmax-snap   # **宿主侧**路径(bind 由 daemon 解析)
  snapshot_index: ${TERMINAL_SNAPSHOT_INDEX} # 客户端可见清单(A800 看不到 162 的盘)
  task_data_root: ${TERMINAL_TASK_DATA}
  image: ${TERMINAL_IMAGE}
  pod_cpu: "1"
  pod_memory: "2g"           # docker 单位(K8s 的 2Gi 写法 docker 不认)
  spawn_concurrency: 256     # 环境侧不做瓶颈:162 实测舒适区 192-256 容器
  create_timeout_s: 300.0
  setup_timeout_s: 600.0
  command_timeout_s: 120.0
  # 注入 episode 容器的环境变量。TB 的 test.sh 用 `uvx -p 3.13 -w pytest…` 判分,
  # uv 默认从 github.com 取 Python standalone 与包 —— GitHub 在 162 不可达,不注入
  # 则**每个 TB 任务 reward 恒 0**(golden 实测:官方参考解也 0 分;注入后 reward=1)。
  # 两条通路都是国内镜像,test.sh 一字不改。TMax 任务不消费这些变量。
  container_env: "UV_PYTHON_INSTALL_MIRROR=https://mirror.nju.edu.cn/github-release/astral-sh/python-build-standalone/,UV_DEFAULT_INDEX=https://mirrors.aliyun.com/pypi/simple/"
  # GitHub 黑洞:test.sh 里注定失败的 curl 会空等 129s TCP 超时,而 uv 已预置。
  # 实测单次判分 122-786s → 26s。当前无境外通路,黑洞化不损失能力。
  container_hosts: "github.com=127.0.0.1,raw.githubusercontent.com=127.0.0.1"
  test_timeout_s: 600.0      # TMax _MIN_TEST_TIMEOUT_S 下限
  test_grace_s: 300.0        # 用默认值:外层墙钟 = test_timeout_s(600) + 此值。
                             # 先前写 120 收得太紧 —— 慢 verifier 会被外层先掐断,
                             # 表现成"任务失败"而非"判分超时",是最难查的假阴性。
  # score_at_budget 保持默认 false = TMax 训练语义(不提交⇒0,不跑 verifier)。
  # 训练/评测同构(PG-3)优先:TB 官方是末步无条件判分,这里若改 true 会让训练与
  # val 的终局语义分叉。代价是 TB 读数偏保守(做完但忘记提交⇒判 0),故 **TB 读数
  # 不可直接与文献锚 21.1% 比**,只作训练趋势监控;复现锚点需另走 TB 官方 harness。

train:
  model_path: /fs/fast/u2021000902/wushang/model/Qwen/Qwen3.5-9B
  train_file: ${TRACE_TRAIN_FILE}
  # **必须是 YAML 列表**:写成标量会被 verl 侧逐字符拆成单字符路径
  # (2026-08-12 干跑实测 data.val_files=['/','f','s',...])。
  # 每个版本一份 parquet ⇒ verl 逐文件出 val 指标,天然分开上报。
  val_files:
    - ${TB_VAL_TB1}
    - ${TB_VAL_TB2}
    - ${TB_VAL_TB21}
    - ${TB_VAL_TB3}
    - ${TB_VAL_TBPRO}
  experiment_name: term_9b_pgs_selfres
  project_name: trace_opd
  n_gpus: 8
  rollout_tp: 1
  train_batch_size: 32
  rollout_n: 16
  agent_num_workers: 32      # 必须 == train_batch_size(同任务副本同 worker)
  ppo_mini_batch_size: 32
  lr: 1.0e-6
  lr_scheduler_type: constant
  lr_warmup_steps_ratio: 0.0
  adv_estimator: pgs_asym_grpo
  norm_adv_by_std: false
  max_prompt_length: 8192    # 用户指令。ALFWorld 的 2048 会截断终端说明书
  response_length: 65536     # 用户指令
  max_token_len_per_gpu: 73728        # = prompt + response,单序列可容
  ppo_max_token_len_per_gpu: 16384
  log_prob_max_token_len_per_gpu: 16384
  ulysses_sp: 4
  use_fused_kernels: true
  rollout_max_model_len: 73728        # 8192 + 65536,模型上限 262144 内
  rollout_max_num_batched_tokens: 16384
  rollout_backend: sglang
  rollout_gpu_mem: 0.55
  rollout_max_num_seqs: 1024          # 用户指令:GPU 侧推理最大并发 1024
  rollout_temperature: 1.0
  loss_agg_mode: seq-mean-token-mean
  vllm_rpc_timeout_ms: 300000
  agent_task_timeout_s: 5400          # 必须显著大于 research.session_timeout_s(2400)
  fsdp_mode: shard
  fsdp_strategy: fsdp2
  fsdp_size: 0
  param_offload: true
  reshard_after_forward: true
  dist_backend: ""
  total_epochs: 2
  test_freq: 20
  save_freq: 20
  max_ckpt_to_keep: 2
  val_before_train: true     # 训前 val = 9B 在 TB 各版本上的 base 读数(白拿基线)
  resume_mode: auto
  loggers: [console, swanlab]

eval:
  response_budget: 65536     # 训练/评测同构(PG-3)
  temperature: 0.0
